<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>변환 계산기</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1b1b1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  :root{
    --bg:#1b1b1f;
    --surface:#242429;
    --line:#38383f;
    --text:#f0efe9;
    --text-muted:#9a9aa2;
    --accent:#e8b13a;
    --accent-soft:rgba(232,177,58,0.12);
    --mono:"SF Mono","Consolas","JetBrains Mono",monospace;
    --sans:-apple-system,"Segoe UI","Pretendard","Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    display:flex;
    justify-content:center;
    padding:48px 20px;
  }
  .wrap{ width:100%; max-width:480px; }

  .ticks{
    height:14px;
    background-image: repeating-linear-gradient(90deg, var(--accent) 0 1.5px, transparent 1.5px 12px);
    opacity:0.6;
    margin-bottom:22px;
  }

  h1{
    font-size:22px;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .sub{
    color:var(--text-muted);
    font-size:13px;
    margin-bottom:32px;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:20px 20px 22px;
    margin-bottom:16px;
  }
  .card-label{
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:600;
    margin-bottom:14px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card-label::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  .row{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .row input[type=number], .row input[type=text]{
    flex:1;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--mono);
    font-size:20px;
    padding:10px 12px;
    border-radius:8px;
    width:0;
    min-width:0;
  }
  input:focus{
    outline:none;
    border-color:var(--accent);
  }
  .unit{
    font-size:12px;
    color:var(--text-muted);
    width:26px;
  }
  .arrow{
    color:var(--text-muted);
    font-size:16px;
    flex:none;
  }
  .result{
    flex:1;
    font-family:var(--mono);
    font-size:20px;
    font-weight:600;
    color:var(--accent);
    text-align:right;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* quick grid: inch / lb side by side */
  .quick-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:16px;
  }
  .mini-card{
    margin-bottom:0;
    padding:14px 14px 16px;
  }
  .mini-card .card-label{
    font-size:10px;
    margin-bottom:10px;
  }
  .mini-row{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .mini-row input[type=number]{
    width:100%;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--mono);
    font-size:16px;
    padding:8px 10px;
    border-radius:8px;
  }
  .mini-result-row{
    display:flex;
    align-items:baseline;
    justify-content:flex-end;
    gap:6px;
  }
  .mini-result-row .arrow{ font-size:13px; }
  .mini-result-row .result{
    font-size:16px;
  }

  /* carrier + divisor row */
  .carrier-divisor-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
  }
  .carrier-group{
    flex:0 0 52%;
    display:flex;
    gap:6px;
  }
  .quad-divider{
    width:1px;
    align-self:stretch;
    background:var(--line);
    flex:none;
  }
  .divisor-group{
    flex:1;
    min-width:0;
  }
  .carrier-btn{
    flex:1;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text-muted);
    font-size:12.5px;
    font-weight:600;
    padding:9px 4px;
    border-radius:8px;
    cursor:pointer;
    text-align:center;
  }
  .carrier-btn.active{
    border-color:var(--accent);
    color:var(--accent);
    background:var(--accent-soft);
  }
  #divisor{
    width:100%;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text);
    font-size:11px;
    padding:9px 8px;
    border-radius:8px;
  }

  /* weight + dims row */
  .quad-wrap{
    display:flex;
    align-items:stretch;
    gap:10px;
    margin-bottom:14px;
  }
  .weight-group{
    flex:0 0 118px;
    min-width:0;
  }
  .dims-group{
    flex:1;
    min-width:0;
  }
  .group-label{
    font-size:11px;
    color:var(--accent);
    font-weight:600;
    margin-bottom:6px;
  }
  .num-cell{
    width:100%;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--mono);
    font-size:18px;
    min-height:52px;
    padding:12px 2px;
    border-radius:8px;
    text-align:center;
  }
  .dim-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:6px;
  }
  .num-cell.small{
    font-size:18px;
    min-height:52px;
    padding:12px 2px;
  }

  /* volumetric / girth row */
  .vg-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:14px;
  }
  .summary-box{
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px;
    text-align:center;
  }
  .summary-box .tag{
    font-size:10.5px;
    color:var(--text-muted);
    letter-spacing:0.04em;
  }
  .summary-box .val{
    font-family:var(--mono);
    font-size:18px;
    font-weight:600;
    margin-top:4px;
    color:var(--text);
  }

  .summary-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:14px;
  }
  .summary-box.highlight{
    border-color:var(--accent);
  }
  .summary-box.highlight .tag{
    color:var(--accent);
  }
  .summary-box.highlight .val{
    color:var(--text);
  }

  .final-box{
    background:var(--accent-soft);
    border:1px solid var(--accent);
    border-radius:10px;
    padding:16px;
    text-align:center;
  }
  .final-box .tag{
    font-size:11px;
    color:var(--accent);
    font-weight:600;
    letter-spacing:0.06em;
  }
  .final-box .final-val{
    font-family:var(--mono);
    font-size:28px;
    font-weight:700;
    color:var(--text);
    margin-top:6px;
  }
  .final-box .basis{
    font-size:11px;
    color:var(--text-muted);
    margin-top:4px;
  }

  .delta-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
    margin-top:0;
  }
  .delta-box{
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px;
    text-align:center;
  }
  .delta-box .tag{
    font-size:10.5px;
    color:var(--text-muted);
    letter-spacing:0.06em;
  }
  .delta-box .val{
    font-family:var(--mono);
    font-size:19px;
    font-weight:600;
    margin-top:4px;
  }
  .delta-box.down .val{ color:#e08a8a; }
  .delta-box.up .val{ color:#7fc9a0; }
  .delta-box.input-box{
    padding:6px;
  }
  .delta-box.input-box input{
    width:100%;
    background:transparent;
    border:none;
    color:var(--text);
    font-family:var(--mono);
    font-size:19px;
    font-weight:600;
    text-align:center;
    padding:10px 2px;
  }
  .delta-box.input-box input:focus{ outline:none; }

  footer{
    text-align:center;
    color:var(--text-muted);
    font-size:11px;
    margin-top:10px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="ticks"></div>
  <h1>변환 계산기</h1>
  <div class="sub">DHL·FedEx 청구무게, 인치·파운드 변환, 증감 30% 계산을 한 화면에서</div>

  <div class="quick-grid">
    <div class="card mini-card">
      <div class="card-label">Inch → cm</div>
      <div class="mini-row">
        <input type="number" id="inch" step="any">
        <div class="mini-result-row">
          <span class="arrow">=</span>
          <span class="result" id="cmResult">0 cm</span>
        </div>
      </div>
    </div>
    <div class="card mini-card">
      <div class="card-label">Pound → kg</div>
      <div class="mini-row">
        <input type="number" id="lb" step="any">
        <div class="mini-result-row">
          <span class="arrow">=</span>
          <span class="result" id="kgResult">0 kg</span>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-label">부피중량 · 청구무게</div>

    <div class="carrier-divisor-row">
      <div class="carrier-group">
        <button type="button" class="carrier-btn active" id="carrierDhl">DHL</button>
        <button type="button" class="carrier-btn" id="carrierFedex">FedEx</button>
      </div>
      <div class="quad-divider"></div>
      <div class="divisor-group">
        <select id="divisor">
          <option value="5000">÷5000 (특송 기본)</option>
          <option value="6000">÷6000 (항공화물 기준)</option>
        </select>
      </div>
    </div>

    <div class="quad-wrap">
      <div class="weight-group">
        <div class="group-label">실중량(kg)</div>
        <input type="text" inputmode="decimal" id="actualWeight" class="num-cell">
      </div>
      <div class="quad-divider"></div>
      <div class="dims-group">
        <div class="group-label">가로 × 세로 × 높이(cm)</div>
        <div class="dim-grid">
          <input type="text" inputmode="decimal" id="dimL" class="num-cell small" placeholder="가로">
          <input type="text" inputmode="decimal" id="dimW" class="num-cell small" placeholder="세로">
          <input type="text" inputmode="decimal" id="dimH" class="num-cell small" placeholder="높이">
        </div>
      </div>
    </div>

    <div class="vg-row">
      <div class="summary-box">
        <div class="tag">둘레</div>
        <div class="val" id="girthResult">0 cm</div>
      </div>
      <div class="summary-box">
        <div class="tag">부피중량</div>
        <div class="val" id="volWeightResult">0 kg</div>
      </div>
    </div>

    <div class="summary-grid">
      <div class="summary-box highlight">
        <div class="tag" id="actualWeightRoundedTag">실중량(DHL 반올림)</div>
        <div class="val" id="actualWeightRoundedResult">0 kg</div>
      </div>
      <div class="summary-box highlight">
        <div class="tag" id="volWeightRoundedTag">부피중량(DHL 반올림)</div>
        <div class="val" id="volWeightRoundedResult">0 kg</div>
      </div>
    </div>

    <div class="final-box">
      <div class="tag" id="carrierTag">DHL 청구무게</div>
      <div class="final-val" id="billableResult">0 kg</div>
      <div class="basis" id="billableBasis">실중량 기준</div>
    </div>
  </div>

  <div class="card">
    <div class="card-label">±30% 증감</div>
    <div class="delta-grid">
      <div class="delta-box input-box">
        <input type="number" id="base" step="any">
      </div>
      <div class="delta-box down">
        <div class="tag">30% 감소</div>
        <div class="val" id="downResult">0</div>
      </div>
      <div class="delta-box up">
        <div class="tag">30% 증가</div>
        <div class="val" id="upResult">0</div>
      </div>
    </div>
  </div>

  <footer>Created by worldbridgelogistics_hyeong-seonJEONG</footer>
</div>

<script>
function fmt(n){
  if (!isFinite(n)) return "-";
  return n.toLocaleString('ko-KR', { maximumFractionDigits: 4 });
}

// Inch -> cm
const inch = document.getElementById('inch');
const cmResult = document.getElementById('cmResult');
function updateInch(){
  const v = parseFloat(inch.value) || 0;
  cmResult.textContent = fmt(v * 2.54) + " cm";
}
inch.addEventListener('input', updateInch);

// Lb -> kg
const lb = document.getElementById('lb');
const kgResult = document.getElementById('kgResult');
function updateLb(){
  const v = parseFloat(lb.value) || 0;
  kgResult.textContent = fmt(v * 0.45359237) + " kg";
}
lb.addEventListener('input', updateLb);

// +-30%
const base = document.getElementById('base');
const downResult = document.getElementById('downResult');
const upResult = document.getElementById('upResult');
function updateDelta(){
  const v = parseFloat(base.value) || 0;
  downResult.textContent = fmt(v * 0.7);
  upResult.textContent = fmt(v * 1.3);
}
base.addEventListener('input', updateDelta);

// Carrier state
let carrier = 'DHL';
const carrierDhl = document.getElementById('carrierDhl');
const carrierFedex = document.getElementById('carrierFedex');
function setCarrier(c){
  carrier = c;
  carrierDhl.classList.toggle('active', c === 'DHL');
  carrierFedex.classList.toggle('active', c === 'FEDEX');
  updateVolumetric();
}
carrierDhl.addEventListener('click', () => setCarrier('DHL'));
carrierFedex.addEventListener('click', () => setCarrier('FEDEX'));

// Billable rounding rules
function billableRound(weightKg, carrierName){
  if (!isFinite(weightKg) || weightKg <= 0) return 0;
  if (carrierName === 'DHL'){
    if (weightKg <= 30){
      return Math.ceil(weightKg / 0.5) * 0.5;
    } else {
      return Math.ceil(weightKg);
    }
  } else { // FEDEX
    if (weightKg <= 20.9){
      return Math.ceil(weightKg / 0.5) * 0.5;
    } else {
      return Math.ceil(weightKg);
    }
  }
}

const actualWeight = document.getElementById('actualWeight');
const dimL = document.getElementById('dimL');
const dimW = document.getElementById('dimW');
const dimH = document.getElementById('dimH');
const divisor = document.getElementById('divisor');

const girthResult = document.getElementById('girthResult');
const volWeightResult = document.getElementById('volWeightResult');
const actualWeightRoundedTag = document.getElementById('actualWeightRoundedTag');
const actualWeightRoundedResult = document.getElementById('actualWeightRoundedResult');
const volWeightRoundedTag = document.getElementById('volWeightRoundedTag');
const volWeightRoundedResult = document.getElementById('volWeightRoundedResult');
const carrierTag = document.getElementById('carrierTag');
const billableResult = document.getElementById('billableResult');
const billableBasis = document.getElementById('billableBasis');

function updateVolumetric(){
  const actual = parseFloat(actualWeight.value) || 0;
  const l = parseFloat(dimL.value) || 0;
  const w = parseFloat(dimW.value) || 0;
  const h = parseFloat(dimH.value) || 0;
  const div = parseFloat(divisor.value) || 5000;

  const volWeight = (l * w * h) / div;

  const longest = Math.max(l, w, h);
  const others = [l, w, h].filter((_, i) => [l, w, h][i] !== longest || true);
  // compute sum of the other two sides (excluding the longest, only once)
  const sides = [l, w, h];
  const maxIdx = sides.indexOf(longest);
  const rest = sides.filter((_, i) => i !== maxIdx);
  const girth = longest + 2 * (rest[0] + rest[1]);

  const carrierLabel = carrier === 'DHL' ? 'DHL' : 'FedEx';

  const actualRounded = billableRound(actual, carrier);
  const volRounded = billableRound(volWeight, carrier);

  girthResult.textContent = fmt(girth) + " cm";
  volWeightResult.textContent = fmt(volWeight) + " kg";

  actualWeightRoundedTag.textContent = `실중량(${carrierLabel} 반올림)`;
  actualWeightRoundedResult.textContent = fmt(actualRounded) + " kg";

  volWeightRoundedTag.textContent = `부피중량(${carrierLabel} 반올림)`;
  volWeightRoundedResult.textContent = fmt(volRounded) + " kg";

  const billable = Math.max(actualRounded, volRounded);
  const basisLabel = volRounded > actualRounded ? "부피중량 기준" : "실중량 기준";

  carrierTag.textContent = `${carrierLabel} 청구무게`;
  billableResult.textContent = fmt(billable) + " kg";
  billableBasis.textContent = basisLabel;
}

[actualWeight, dimL, dimW, dimH, divisor].forEach(el => {
  el.addEventListener('input', updateVolumetric);
  el.addEventListener('change', updateVolumetric);
});

updateInch(); updateLb(); updateDelta(); updateVolumetric();

// Service worker registration
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js');
  });
}
</script>
</body>
</html>
