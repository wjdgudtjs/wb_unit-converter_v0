<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>변환 계산기</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b1b1f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="변환계산기">
<meta name="mobile-web-app-capable" content="yes">

<style>
  :root{
    --bg:#1b1b1f;
    --surface:#242429;
    --line:#38383f;
    --text:#f0efe9;
    --text-muted:#9a9aa2;
    --accent:#e8b13a;
    --accent-soft:rgba(232,177,58,0.12);
    --mono:"SF Mono","Consolas","JetBrains Mono",monospace;
    --sans:-apple-system,"Segoe UI","Pretendard","Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box;}
  html, body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    display:flex;
    justify-content:center;
    padding:calc(48px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  input{ user-select:text; }
  .wrap{ width:100%; max-width:480px; }

  .ticks{
    height:14px;
    background-image: repeating-linear-gradient(90deg, var(--accent) 0 1.5px, transparent 1.5px 12px);
    opacity:0.6;
    margin-bottom:22px;
  }

  h1{
    font-size:22px;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .sub{
    color:var(--text-muted);
    font-size:13px;
    margin-bottom:32px;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:20px 20px 22px;
    margin-bottom:16px;
  }
  .card-label{
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:600;
    margin-bottom:14px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card-label::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  .quick-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:16px;
  }
  .mini-card{
    margin-bottom:0;
    padding:16px 14px 18px;
  }
  .mini-card input[type=number]{
    width:100%;
    text-align:center;
    font-size:18px;
    padding:10px 8px;
  }
  .mini-result-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    margin-top:10px;
    flex-wrap:wrap;
  }
  .mini-result-row .unit{
    width:auto;
  }
  .mini-result-row .result{
    flex:none;
    font-size:17px;
  }

  .row{
    display:flex;
    align-items:center;
    gap:14px;
  }
  input[type=number],
  input[type=text]{
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--mono);
    font-size:20px;
    padding:10px 12px;
    border-radius:8px;
  }
  .row input[type=number],
  .row input[type=text]{
    flex:1;
    width:0;
    min-width:0;
  }
  input[type=number]:focus,
  input[type=text]:focus{
    outline:none;
    border-color:var(--accent);
  }
  input[type=number]{
    -moz-appearance:textfield;
  }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
  }
  .unit{
    font-size:12px;
    color:var(--text-muted);
    width:26px;
  }
  .arrow{
    color:var(--text-muted);
    font-size:16px;
    flex:none;
  }
  .result{
    flex:1;
    font-family:var(--mono);
    font-size:20px;
    font-weight:600;
    color:var(--accent);
    text-align:right;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .delta-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
    margin-top:16px;
  }
  .delta-box{
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px 8px;
    text-align:center;
  }
  .delta-box .tag{
    font-size:10.5px;
    color:var(--text-muted);
    letter-spacing:0.06em;
  }
  .delta-box .val{
    font-family:var(--mono);
    font-size:19px;
    font-weight:600;
    margin-top:4px;
  }
  .delta-box.down .val{ color:#e08a8a; }
  .delta-box.up .val{ color:#7fc9a0; }
  .delta-box.input-box{
    border-color:var(--accent);
  }
  .delta-box.input-box .tag{
    color:var(--accent);
  }
  .delta-box.input-box input{
    margin-top:4px;
    background:transparent;
    border:none;
    padding:0;
    font-size:19px;
    font-weight:600;
    min-height:auto;
  }

  footer{
    text-align:center;
    color:var(--text-muted);
    font-size:11px;
    margin-top:10px;
  }

  .toggle-group{
    display:flex;
    gap:6px;
  }
  .toggle-btn{
    flex:1;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text-muted);
    font-family:var(--sans);
    font-size:12.5px;
    font-weight:600;
    padding:8px 6px;
    border-radius:7px;
    cursor:pointer;
  }
  .toggle-btn.active{
    background:var(--accent-soft);
    border-color:var(--accent);
    color:var(--accent);
  }

  .field-label{
    font-size:11px;
    color:var(--text-muted);
    margin-bottom:6px;
    margin-top:14px;
  }
  .field-label:first-of-type{ margin-top:0; }

  .quad-wrap{
    display:flex;
    gap:10px;
    margin-top:14px;
    align-items:stretch;
  }
  .weight-group{
    flex:0 0 100px;
    display:flex;
    flex-direction:column;
  }
  .dims-group{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .quad-divider{
    width:2px;
    background:var(--accent);
    opacity:0.5;
    border-radius:2px;
    flex:none;
  }
  .carrier-divisor-row{
    display:flex;
    gap:10px;
    align-items:stretch;
  }
  .carrier-group{
    flex:0 0 52%;
    display:flex;
    flex-direction:column;
  }
  .divisor-group{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .divisor-group select{
    margin-top:auto;
    font-size:11px;
    padding:9px 8px;
  }
  .carrier-group .toggle-group{
    margin-top:auto;
  }
  .group-label{
    font-size:11px;
    letter-spacing:0.04em;
    text-align:center;
    font-weight:600;
    margin-bottom:6px;
    color:var(--accent);
  }
  .mini-tag{
    font-size:10.5px;
    color:var(--text-muted);
    text-align:center;
    margin-bottom:4px;
  }
  .num-cell{
    width:100%;
    min-height:52px;
    font-size:18px;
    text-align:center;
    padding:12px 2px;
    line-height:1.2;
  }
  .dim-three-labels{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
    margin-bottom:4px;
  }
  .dim-three-labels span{
    font-size:10.5px;
    color:var(--text-muted);
    text-align:center;
  }
  .dim-three-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:6px;
    flex:1;
  }
  .num-cell.small{
    min-height:40px;
    font-size:13px;
    padding:8px 1px;
  }
  .vg-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:12px;
  }

  select{
    width:100%;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--sans);
    font-size:14px;
    padding:9px 10px;
    border-radius:8px;
    -webkit-appearance:none;
    appearance:none;
  }
  select:focus{ outline:none; border-color:var(--accent); }

  .summary-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:16px;
  }
  .summary-grid.three-col{
    grid-template-columns:1fr 1fr 1fr;
  }
  .summary-box{
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 6px;
    text-align:center;
  }
  .summary-box .tag{
    font-size:10px;
    color:var(--text-muted);
    letter-spacing:0.04em;
  }
  .summary-box .val{
    font-family:var(--mono);
    font-size:16px;
    font-weight:600;
    margin-top:4px;
  }
  .summary-grid.three-col .summary-box .val{
    font-size:14px;
  }
  .summary-box.highlight{
    border-color:var(--accent);
  }
  .summary-box.highlight .tag{
    color:var(--accent);
  }
  .final-box{
    margin-top:10px;
    background:var(--accent-soft);
    border:1px solid var(--accent);
    border-radius:8px;
    padding:14px;
    text-align:center;
  }
  .final-box .tag{
    font-size:11px;
    color:var(--accent);
    letter-spacing:0.06em;
    font-weight:600;
  }
  .final-box .val{
    font-family:var(--mono);
    font-size:26px;
    font-weight:700;
    color:var(--accent);
    margin-top:4px;
  }
  .final-box .basis{
    font-size:10.5px;
    color:var(--text-muted);
    margin-top:2px;
  }

  #installBtn{
    display:none;
    width:100%;
    margin-bottom:16px;
    padding:12px;
    background:var(--accent-soft);
    border:1px solid var(--accent);
    color:var(--accent);
    font-family:var(--sans);
    font-size:13px;
    font-weight:600;
    border-radius:8px;
    cursor:pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="ticks"></div>
  <h1>변환 계산기</h1>
  <div class="sub">인치·파운드 변환, 부피중량·청구무게, 증감 30% 계산을 한 화면에서</div>

  <button id="installBtn">📲 홈 화면에 추가하기</button>

  <div class="quick-grid">
    <div class="card mini-card">
      <div class="card-label">Inch → cm</div>
      <input type="number" id="inch" value="1" step="any" inputmode="decimal">
      <div class="mini-result-row">
        <span class="unit">in</span>
        <span class="arrow">→</span>
        <span class="result" id="cmResult">2.54</span>
      </div>
    </div>

    <div class="card mini-card">
      <div class="card-label">Pound → kg</div>
      <input type="number" id="lb" value="1" step="any" inputmode="decimal">
      <div class="mini-result-row">
        <span class="unit">lb</span>
        <span class="arrow">→</span>
        <span class="result" id="kgResult">0.4536</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-label">부피중량 · 청구무게</div>

    <div class="carrier-divisor-row">
      <div class="carrier-group">
        <div class="group-label">운송사</div>
        <div class="toggle-group">
          <button type="button" class="toggle-btn active" id="carrierDhl">DHL</button>
          <button type="button" class="toggle-btn" id="carrierFedex">FedEx</button>
        </div>
      </div>
      <div class="quad-divider"></div>
      <div class="divisor-group">
        <div class="group-label">부피중량 계수</div>
        <select id="divisor">
          <option value="5000">÷5000 (특송 기본)</option>
          <option value="6000">÷6000 (항공화물 기준)</option>
        </select>
      </div>
    </div>

    <div class="quad-wrap">
      <div class="weight-group">
        <div class="group-label weight">실중량 (kg)</div>
        <div class="mini-tag">실중량</div>
        <input type="text" id="actualWeight" value="4" inputmode="decimal" pattern="[0-9]*[.]?[0-9]*" class="num-cell">
      </div>
      <div class="quad-divider"></div>
      <div class="dims-group">
        <div class="group-label dims">가로 × 세로 × 높이 (cm)</div>
        <div class="dim-three-labels"><span>가로</span><span>세로</span><span>높이</span></div>
        <div class="dim-three-grid compact">
          <input type="text" id="dimL" value="1" inputmode="decimal" pattern="[0-9]*[.]?[0-9]*" class="num-cell small">
          <input type="text" id="dimW" value="1" inputmode="decimal" pattern="[0-9]*[.]?[0-9]*" class="num-cell small">
          <input type="text" id="dimH" value="1" inputmode="decimal" pattern="[0-9]*[.]?[0-9]*" class="num-cell small">
        </div>
      </div>
    </div>

    <div class="vg-row">
      <div class="summary-box">
        <div class="tag">둘레 (girth)</div>
        <div class="val" id="girthResult">–</div>
      </div>
      <div class="summary-box">
        <div class="tag">부피중량</div>
        <div class="val" id="volWeightResult">–</div>
      </div>
    </div>

    <div class="summary-grid">
      <div class="summary-box highlight">
        <div class="tag" id="actualWeightRoundedTag">실중량(DHL 반올림)</div>
        <div class="val" id="actualWeightRoundedResult">–</div>
      </div>
      <div class="summary-box highlight">
        <div class="tag" id="volWeightRoundedTag">부피중량(DHL 반올림)</div>
        <div class="val" id="volWeightRoundedResult">–</div>
      </div>
    </div>

    <div class="final-box">
      <div class="tag" id="carrierTag">DHL 청구무게</div>
      <div class="val" id="billableResult">–</div>
      <div class="basis" id="billableBasis"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-label">±30% 증감</div>
    <div class="delta-grid">
      <div class="delta-box input-box">
        <div class="tag">기준값</div>
        <input type="text" id="base" value="100" inputmode="decimal" pattern="[0-9]*[.]?[0-9]*" class="num-cell">
      </div>
      <div class="delta-box down">
        <div class="tag">30% 감소</div>
        <div class="val" id="downResult">70</div>
      </div>
      <div class="delta-box up">
        <div class="tag">30% 증가</div>
        <div class="val" id="upResult">130</div>
      </div>
    </div>
  </div>

  <footer>Created by worldbridgelogistics_hyeong-seonJEONG</footer>
</div>

<script>
function fmt(n){
  if (!isFinite(n)) return "-";
  return n.toLocaleString('ko-KR', { maximumFractionDigits: 4 });
}

const inch = document.getElementById('inch');
const cmResult = document.getElementById('cmResult');
function updateInch(){
  const v = parseFloat(inch.value) || 0;
  cmResult.textContent = fmt(v * 2.54) + " cm";
}
inch.addEventListener('input', updateInch);

const lb = document.getElementById('lb');
const kgResult = document.getElementById('kgResult');
function updateLb(){
  const v = parseFloat(lb.value) || 0;
  kgResult.textContent = fmt(v * 0.45359237) + " kg";
}
lb.addEventListener('input', updateLb);

const base = document.getElementById('base');
const downResult = document.getElementById('downResult');
const upResult = document.getElementById('upResult');
function updateDelta(){
  const v = parseFloat(base.value) || 0;
  downResult.textContent = fmt(v * 0.7);
  upResult.textContent = fmt(v * 1.3);
}
base.addEventListener('input', updateDelta);

updateInch(); updateLb(); updateDelta();

// ---- 부피중량 · 청구무게 계산기 ----
const dimL = document.getElementById('dimL');
const dimW = document.getElementById('dimW');
const dimH = document.getElementById('dimH');
const divisor = document.getElementById('divisor');
const actualWeight = document.getElementById('actualWeight');
const volWeightResult = document.getElementById('volWeightResult');
const volWeightRoundedResult = document.getElementById('volWeightRoundedResult');
const volWeightRoundedTag = document.getElementById('volWeightRoundedTag');
const girthResult = document.getElementById('girthResult');
const actualWeightRoundedTag = document.getElementById('actualWeightRoundedTag');
const actualWeightRoundedResult = document.getElementById('actualWeightRoundedResult');
const billableResult = document.getElementById('billableResult');
const billableBasis = document.getElementById('billableBasis');
const carrierTag = document.getElementById('carrierTag');
const carrierDhlBtn = document.getElementById('carrierDhl');
const carrierFedexBtn = document.getElementById('carrierFedex');

let carrier = 'DHL'; // 'DHL' | 'FEDEX'

function setCarrier(c){
  carrier = c;
  carrierDhlBtn.classList.toggle('active', c === 'DHL');
  carrierFedexBtn.classList.toggle('active', c === 'FEDEX');
  updateVolumetric();
}
carrierDhlBtn.addEventListener('click', () => setCarrier('DHL'));
carrierFedexBtn.addEventListener('click', () => setCarrier('FEDEX'));

// 반올림: DHL/FedEx 청구무게 규칙
function billableRound(weightKg, carrierName){
  if (weightKg <= 0) return 0;
  if (carrierName === 'DHL') {
    // 0.1~30kg: 0.5kg 단위 올림 / 30.1kg부터: 1kg 단위 올림
    return weightKg > 30
      ? Math.ceil(weightKg)
      : Math.ceil(weightKg * 2) / 2;
  } else {
    // FedEx: 0.1~20.9kg: 0.5kg 단위 올림 / 21kg부터: 1kg 단위 올림
    return weightKg >= 21
      ? Math.ceil(weightKg)
      : Math.ceil(weightKg * 2) / 2;
  }
}

function updateVolumetric(){
  const l = parseFloat(dimL.value) || 0;
  const w = parseFloat(dimW.value) || 0;
  const h = parseFloat(dimH.value) || 0;
  const div = parseFloat(divisor.value) || 5000;
  const actual = parseFloat(actualWeight.value) || 0;

  const volWeight = (l * w * h) / div;
  const volWeightRounded = billableRound(volWeight, carrier);

  const sides = [l, w, h];
  const longest = Math.max(...sides);
  const longestIdx = sides.indexOf(longest);
  const others = sides.filter((_, i) => i !== longestIdx);
  const girth = longest + 2 * (others[0] + others[1]);

  volWeightResult.textContent = fmt(volWeight) + " kg";
  volWeightRoundedTag.textContent = `부피중량(${carrier === 'DHL' ? 'DHL' : 'FedEx'} 반올림)`;
  girthResult.textContent = fmt(girth) + " cm";
  volWeightRoundedResult.textContent = fmt(volWeightRounded) + " kg";

  const carrierLabel = carrier === 'DHL' ? 'DHL' : 'FedEx';
  const actualWeightRounded = billableRound(actual, carrier);
  actualWeightRoundedTag.textContent = `실중량(${carrierLabel} 반올림)`;
  actualWeightRoundedResult.textContent = fmt(actualWeightRounded) + " kg";

  const rawBillable = Math.max(volWeight, actual);
  const billable = billableRound(rawBillable, carrier);
  const basisLabel = volWeight >= actual ? "부피중량 기준" : "실중량 기준";

  carrierTag.textContent = (carrier === 'DHL' ? 'DHL' : 'FedEx') + ' 청구무게';
  billableResult.textContent = fmt(billable) + " kg";
  billableBasis.textContent = basisLabel;
}

[dimL, dimW, dimH, divisor, actualWeight].forEach((el) => {
  el.addEventListener('input', updateVolumetric);
});
divisor.addEventListener('change', updateVolumetric);

updateVolumetric();

// PWA install prompt (Android/Chrome)
let deferredPrompt;
const installBtn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = 'block';
});
installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBtn.style.display = 'none';
});
window.addEventListener('appinstalled', () => {
  installBtn.style.display = 'none';
});

// Register service worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
