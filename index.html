<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>변환 계산기</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b1b1f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="변환계산기">
<meta name="mobile-web-app-capable" content="yes">

<style>
  :root{
    --bg:#1b1b1f;
    --surface:#242429;
    --line:#38383f;
    --text:#f0efe9;
    --text-muted:#9a9aa2;
    --accent:#e8b13a;
    --accent-soft:rgba(232,177,58,0.12);
    --mono:"SF Mono","Consolas","JetBrains Mono",monospace;
    --sans:-apple-system,"Segoe UI","Pretendard","Noto Sans KR",sans-serif;
  }
  *{box-sizing:border-box;}
  html, body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    display:flex;
    justify-content:center;
    padding:calc(48px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  input{ user-select:text; }
  .wrap{ width:100%; max-width:480px; }

  .ticks{
    height:14px;
    background-image: repeating-linear-gradient(90deg, var(--accent) 0 1.5px, transparent 1.5px 12px);
    opacity:0.6;
    margin-bottom:22px;
  }

  h1{
    font-size:22px;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .sub{
    color:var(--text-muted);
    font-size:13px;
    margin-bottom:32px;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:20px 20px 22px;
    margin-bottom:16px;
  }
  .card-label{
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:600;
    margin-bottom:14px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card-label::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  .row{
    display:flex;
    align-items:center;
    gap:14px;
  }
  input[type=number]{
    flex:1;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text);
    font-family:var(--mono);
    font-size:20px;
    padding:10px 12px;
    border-radius:8px;
    width:0;
    min-width:0;
  }
  input[type=number]:focus{
    outline:none;
    border-color:var(--accent);
  }
  .unit{
    font-size:12px;
    color:var(--text-muted);
    width:26px;
  }
  .arrow{
    color:var(--text-muted);
    font-size:16px;
    flex:none;
  }
  .result{
    flex:1;
    font-family:var(--mono);
    font-size:20px;
    font-weight:600;
    color:var(--accent);
    text-align:right;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .delta-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:16px;
  }
  .delta-box{
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px;
    text-align:center;
  }
  .delta-box .tag{
    font-size:10.5px;
    color:var(--text-muted);
    letter-spacing:0.06em;
  }
  .delta-box .val{
    font-family:var(--mono);
    font-size:19px;
    font-weight:600;
    margin-top:4px;
  }
  .delta-box.down .val{ color:#e08a8a; }
  .delta-box.up .val{ color:#7fc9a0; }

  footer{
    text-align:center;
    color:var(--text-muted);
    font-size:11px;
    margin-top:10px;
  }

  #installBtn{
    display:none;
    width:100%;
    margin-bottom:16px;
    padding:12px;
    background:var(--accent-soft);
    border:1px solid var(--accent);
    color:var(--accent);
    font-family:var(--sans);
    font-size:13px;
    font-weight:600;
    border-radius:8px;
    cursor:pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="ticks"></div>
  <h1>변환 계산기</h1>
  <div class="sub">인치·파운드 변환, 증감 30% 계산을 한 화면에서</div>

  <button id="installBtn">📲 홈 화면에 추가하기</button>

  <div class="card">
    <div class="card-label">Inch → cm</div>
    <div class="row">
      <input type="number" id="inch" value="1" step="any" inputmode="decimal">
      <span class="unit">in</span>
      <span class="arrow">→</span>
      <span class="result" id="cmResult">2.54</span>
    </div>
  </div>

  <div class="card">
    <div class="card-label">Pound → kg</div>
    <div class="row">
      <input type="number" id="lb" value="1" step="any" inputmode="decimal">
      <span class="unit">lb</span>
      <span class="arrow">→</span>
      <span class="result" id="kgResult">0.4536</span>
    </div>
  </div>

  <div class="card">
    <div class="card-label">±30% 증감</div>
    <div class="row">
      <input type="number" id="base" value="100" step="any" inputmode="decimal">
      <span class="unit"></span>
    </div>
    <div class="delta-grid">
      <div class="delta-box down">
        <div class="tag">30% 감소</div>
        <div class="val" id="downResult">70</div>
      </div>
      <div class="delta-box up">
        <div class="tag">30% 증가</div>
        <div class="val" id="upResult">130</div>
      </div>
    </div>
  </div>

  <footer>1 in = 2.54 cm · 1 lb = 0.45359237 kg</footer>
</div>

<script>
function fmt(n){
  if (!isFinite(n)) return "-";
  return n.toLocaleString('ko-KR', { maximumFractionDigits: 4 });
}

const inch = document.getElementById('inch');
const cmResult = document.getElementById('cmResult');
function updateInch(){
  const v = parseFloat(inch.value) || 0;
  cmResult.textContent = fmt(v * 2.54) + " cm";
}
inch.addEventListener('input', updateInch);

const lb = document.getElementById('lb');
const kgResult = document.getElementById('kgResult');
function updateLb(){
  const v = parseFloat(lb.value) || 0;
  kgResult.textContent = fmt(v * 0.45359237) + " kg";
}
lb.addEventListener('input', updateLb);

const base = document.getElementById('base');
const downResult = document.getElementById('downResult');
const upResult = document.getElementById('upResult');
function updateDelta(){
  const v = parseFloat(base.value) || 0;
  downResult.textContent = fmt(v * 0.7);
  upResult.textContent = fmt(v * 1.3);
}
base.addEventListener('input', updateDelta);

updateInch(); updateLb(); updateDelta();

// PWA install prompt (Android/Chrome)
let deferredPrompt;
const installBtn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = 'block';
});
installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBtn.style.display = 'none';
});
window.addEventListener('appinstalled', () => {
  installBtn.style.display = 'none';
});

// Register service worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
